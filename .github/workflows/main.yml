name: Build RootActivityLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install modified android.jar for hidden APIs
        run: |
          curl -fL \
            https://raw.githubusercontent.com/Reginer/aosp-android-jar/main/android-36/android.jar \
            -o "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootActivityLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
